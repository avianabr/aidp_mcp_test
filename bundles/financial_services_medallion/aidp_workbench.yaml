bundle:
  name: "financial_services_medallion"
  description: "Camadas Bronze, Silver e Gold independentes, seguidas de Spark ML."
resources:
  jobs:
    - "finance_medallion_pipeline"
defaults:
  publish:
    path: "/Workspace/Shared/financial_services_medallion_modular"
    overwrite_publish_artifacts: false
    preserve_resource_name: true
  variables:
    compute_key: "CONFIGURE_COMPUTE_KEY"
    dataset_id: "bundle_dev"
    catalog_name: "default"
    account_count: "5000"
    seed: "42"
    rf_num_trees: "100"
    rf_max_depth: "10"
    enable_liquid_clustering: "false"
